name: ❓ Question
description: Not sure how something works? Ask here
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For quick questions, the [Discord](https://discord.gg/HgN3HdQpxT) or [subreddit](https://www.reddit.com/r/metrovlauncher/) is usually faster, other users can help there too.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Metrov version (if it matters)
      placeholder: "2.3.2"
